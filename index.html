<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Dashboard</title>
<style>
:root {
  --bg: #FFF9F0;
  --card: #FFFFFF;
  --border: #F0E6D8;
  --green: #1B8A5A;
  --green-light: #27AE6B;
  --pink: #E8637A;
  --pink-light: #FDE8EC;
  --orange: #E8943A;
  --orange-light: #FFF0E0;
  --purple: #7C6FD4;
  --purple-light: #EDEAFF;
  --blue: #4A90D9;
  --blue-light: #E8F1FC;
  --text: #2D2A24;
  --muted: #8C857A;
  --light-muted: #B8B0A2;
  --cream-dark: #F0E6D8;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-hover: 0 4px 20px rgba(0,0,0,0.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-weight:500}

.header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;box-shadow:0 1px 8px rgba(0,0,0,0.04);flex-wrap:wrap;gap:10px}
.header h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--green),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.filters{display:flex;gap:6px}
.fbtn{padding:7px 16px;border:2px solid var(--border);border-radius:20px;background:white;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;transition:all .2s}
.fbtn.active{background:var(--green);border-color:var(--green);color:white}
.fbtn:hover:not(.active){border-color:var(--green);color:var(--green)}

.date-filter{display:flex;align-items:center;gap:10px;margin:14px 24px 0;flex-wrap:wrap}
.date-filter label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.date-filter input{background:white;border:2px solid var(--border);border-radius:10px;color:var(--text);padding:7px 14px;font-size:13px;font-family:inherit;font-weight:600}
.date-filter input:focus{border-color:var(--green);outline:none}
.date-filter button{padding:7px 16px;border:none;border-radius:10px;background:var(--green);color:white;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700}

.page{max-width:1200px;margin:0 auto;padding:16px}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin:24px 0 12px 4px;font-weight:800}

/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow);transition:box-shadow .2s}
.kpi:hover{box-shadow:var(--shadow-hover)}
.kpi-icon{font-size:22px;margin-bottom:4px}
.kpi-value{font-size:24px;font-weight:900;line-height:1.2}
.kpi-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}
.kpi-sub{font-size:9px;color:var(--light-muted);font-weight:600;margin-top:2px}

.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-1-2{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media(max-width:700px){.row-3,.row-2,.row-1-2,.kpi-strip{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-hover)}
.card-title{font-size:10px;color:var(--light-muted);text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin-bottom:10px;font-weight:800}

.big{font-size:38px;font-weight:900;text-align:center;line-height:1.1}
.mid{font-size:24px;font-weight:800}
.sm{font-size:11px;color:var(--muted);font-weight:600}
.xs{font-size:9px;color:var(--light-muted);font-weight:600}
.center{text-align:center}
.divider{height:1px;background:var(--border);margin:10px 0}
.flex-around{display:flex;justify-content:space-around}
.flex-between{display:flex;justify-content:space-between}

.bar-bg{height:5px;background:var(--cream-dark);border-radius:3px;margin-top:5px;overflow:hidden}
.bar{height:100%;border-radius:3px}

.hab{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.hab:last-child{border-bottom:none}
.hab-icon{font-size:22px;width:28px;text-align:center}
.hab-lbl{font-size:10px;color:var(--light-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.hab-val{font-weight:800;font-size:16px}

.meal{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-weight:600}
.meal:last-of-type{border-bottom:none}
.meal-icon{font-size:16px}
.meal-name{font-size:13px;font-weight:700;color:var(--text)}
.meal-meta{font-size:10px;color:var(--light-muted);font-weight:600}
.meal-kcal{font-size:13px;font-weight:800;color:var(--green);margin-left:auto;white-space:nowrap}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:280px;margin:0 auto}
.cal-header{font-size:9px;color:var(--light-muted);text-align:center;font-weight:800;padding:2px 0}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;transition:transform .15s}
.cal-cell:not(.cal-empty):hover{transform:scale(1.15)}
.cal-empty{background:transparent}

.dots{letter-spacing:5px;font-size:18px;margin-top:6px}
.legend{display:flex;justify-content:center;gap:10px;margin-top:8px;font-size:10px;color:var(--light-muted);font-weight:600}
.leg-box{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:3px}

.coffee-row{display:flex;justify-content:center;gap:4px;margin:8px 0}
.coffee-cup{font-size:26px;transition:all .3s}
.coffee-cup.empty{opacity:0.12;filter:grayscale(1)}

.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;margin-left:4px}
.tag-fuzzy{background:var(--orange-light);color:var(--orange)}
.tag-manual{background:var(--purple-light);color:var(--purple)}

/* Finance */
.fin-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-weight:600}
.fin-row:last-of-type{border-bottom:none}
.fin-cat-badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:9px;font-weight:700;white-space:nowrap}
.fin-amount{font-size:14px;font-weight:800;margin-left:auto;white-space:nowrap}
.fin-desc{font-size:12px;font-weight:600;color:var(--text)}
.fin-bar{display:flex;border-radius:6px;overflow:hidden;height:8px;margin-top:6px}

/* Tooltips */
.tooltip-wrap { position: relative; cursor: help; }
.tooltip-wrap .tooltip {
  visibility: hidden; opacity: 0;
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%); z-index: 100;
  background: #2D2A24; color: #FFF9F0;
  padding: 8px 14px; border-radius: 10px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap; pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  transition: opacity .2s, visibility .2s;
}
.tooltip-wrap .tooltip::after {
  content: ''; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: #2D2A24;
}
.tooltip-wrap:hover .tooltip { visibility: visible; opacity: 1; }

.loading{text-align:center;color:var(--light-muted);padding:60px 20px;font-size:14px;font-weight:600}
</style>
</head>
<body>

<div class="header">
  <h1>🌿 Health & Finance</h1>
  <div class="filters">
    <button class="fbtn active" onclick="setFilter('all')">Все</button>
    <button class="fbtn" onclick="setFilter('Коля')">Коля</button>
    <button class="fbtn" onclick="setFilter('Аня')">Аня</button>
  </div>
</div>
<div class="date-filter">
  <label>📅</label>
  <input type="date" id="dateInput">
  <button onclick="setDateToday()">Сегодня</button>
</div>
<div class="page" id="app"><div class="loading">Загрузка…</div></div>

<script>
const URLS = {
  weight: 'https://docs.google.com/spreadsheets/d/1feIqfXQHQ_ukq1Eon7aJ_FZ1_-JVfEyU2hVL6UduvgA/export?format=csv&gid=41946739',
  habits: 'https://docs.google.com/spreadsheets/d/1oS3GUOiR1ifMJwwnNRowBB29NAHKOo_y1PchmeGpuYM/export?format=csv&gid=860111203',
  meals:  'https://docs.google.com/spreadsheets/d/1FFvdWKoiRLKspCe1vELmMC0lwpI3wkS8w-c-hWhXTMw/export?format=csv&gid=927239233',
  kbju:   'https://docs.google.com/spreadsheets/d/1Ck7j5lRkfXg5VnBrPWqZjA4zqzYywkhlWSkRX3i5KJU/export?format=csv&gid=0',
  finance:'https://docs.google.com/spreadsheets/d/1KfJmOvte67hprgf4h3P-O8UyINKz4XjQEx6b8SmU_wk/export?format=csv&gid=2103534362'
};

const GOALS_MAP={
  'Аня':{kcal:1450,prot:110,fat:48,carb:144,water:2000,sleep:8,weightGoals:[60,57,55]},
  'Коля':{kcal:2400,prot:165,fat:80,carb:255,water:2500,sleep:8,weightGoals:[95,90,85]}
};
const GOALS_DEF={kcal:2000,prot:120,fat:70,carb:250,water:2500,sleep:8,weightGoals:[]};
function getGoals(){return(filter!=='all'&&GOALS_MAP[filter])||GOALS_DEF}
function getWeightGoal(cw,goals){if(!goals||!goals.length||cw==null)return null;for(const g of goals){if(cw>g)return g}return null}
function getWeightGoalIndex(cw,goals){if(!goals||!goals.length||cw==null)return-1;for(let i=0;i<goals.length;i++){if(cw>goals[i])return i}return goals.length}

const COFFEE_WORDS=['кофе','капучино','латте','флэт уайт','флет уайт','flat white','раф','американо','эспрессо'];
const STOP_WORDS=new Set(['с','и','на','в','из','без','по','для','от','до','за','под','над','к','о','об']);
const COMPOSITE_DISHES={'бутерброд с маслом':{kcal:332,prot:6.5,fat:16,carb:40},'бутерброд с сыром':{kcal:340,prot:12,fat:15,carb:38},'бутерброд с колбасой':{kcal:330,prot:11,fat:14,carb:37},'хлеб с маслом':{kcal:332,prot:6.5,fat:16,carb:40},'хлеб с сыром':{kcal:340,prot:12,fat:15,carb:38},'тост с маслом':{kcal:315,prot:6,fat:14,carb:42},'каша с маслом':{kcal:130,prot:3.5,fat:4,carb:18},'макароны с сыром':{kcal:260,prot:10,fat:12,carb:28},'макароны с курицей':{kcal:180,prot:14,fat:4,carb:22},'рис с курицей':{kcal:170,prot:13,fat:3,carb:23},'гречка с курицей':{kcal:155,prot:14,fat:2.5,carb:18},'гречка с мясом':{kcal:160,prot:11,fat:5,carb:18},'рис с овощами':{kcal:130,prot:2.5,fat:2,carb:25},'кофе с молоком':{kcal:52,prot:1.8,fat:1.8,carb:6},'кофе с сахаром':{kcal:50,prot:0,fat:0,carb:12},'творог с медом':{kcal:165,prot:14,fat:4,carb:20},'овсянка на молоке':{kcal:110,prot:4,fat:3.5,carb:17}};
const SYNONYMS={'греча':'гречка','гречка':'гречка','овсянка':'овсянка','геркулес':'овсянка','рис':'рис','макароны':'макароны','паста':'макароны','спагетти':'макароны','курица':'курица','курочка':'курица','индейка':'индейка','говядина':'говядина','свинина':'свинина','сосиски':'сосиски','колбаса':'колбаса','семга':'семга','лосось':'семга','треска':'треска','минтай':'минтай','тунец':'тунец','креветки':'креветки','селедка':'сельдь','творог':'творог','молоко':'молоко','кефир':'кефир','йогурт':'йогурт','сыр':'сыр','сметана':'сметана','яйцо':'яйцо куриное','яйца':'яйцо куриное','картошка':'картошка','помидор':'помидор','огурец':'огурец','капуста':'капуста','морковь':'морковь','яблоко':'яблоко','банан':'банан','хлеб':'хлеб','шоколад':'шоколад','сахар':'сахар','мед':'мед','кофе':'кофе','чай':'чай','пиво':'пиво','вино':'вино','водка':'водка'};
const CAT_COLORS={'Продукты':{color:'#1B8A5A',bg:'#E8F5E9',icon:'🛒'},'Еда вне дома':{color:'#E8943A',bg:'#FFF0E0',icon:'🍽️'},'Кафе':{color:'#E8943A',bg:'#FFF0E0',icon:'☕'},'Транспорт':{color:'#4A90D9',bg:'#E8F1FC',icon:'🚕'},'Дом':{color:'#7C6FD4',bg:'#EDEAFF',icon:'🏠'},'Одежда':{color:'#E8637A',bg:'#FDE8EC',icon:'👗'},'Здоровье':{color:'#1B8A5A',bg:'#E8F5E9',icon:'💊'},'Спорт':{color:'#27AE6B',bg:'#E8F5E9',icon:'🏋️'},'Подписки':{color:'#4A90D9',bg:'#E8F1FC',icon:'📱'},'Развлечения':{color:'#E8943A',bg:'#FFF0E0',icon:'🎉'},'Образование':{color:'#7C6FD4',bg:'#EDEAFF',icon:'📚'},'Питомцы':{color:'#E8943A',bg:'#FFF0E0',icon:'🐱'},'Красота':{color:'#E8637A',bg:'#FDE8EC',icon:'💅'},'Связь':{color:'#4A90D9',bg:'#E8F1FC',icon:'📞'},'Подарки':{color:'#E8943A',bg:'#FFF0E0',icon:'🎁'}};
const CAT_DEFAULT={color:'#8C857A',bg:'#F5F0E8',icon:'💰'};
function getCatStyle(c){c=(c||'').trim();if(CAT_COLORS[c])return CAT_COLORS[c];for(const[k,v]of Object.entries(CAT_COLORS)){if(c.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(c.toLowerCase()))return v}return CAT_DEFAULT}

let RAW={},filter='all',selectedDate=null,expandedCat=null;
function csvParse(t){const l=t.split('\n').filter(l=>l.trim());if(l.length<2)return[];const hd=csvLine(l[0]);return l.slice(1).map(r=>{const v=csvLine(r);const o={};hd.forEach((k,i)=>o[k.trim()]=(v[i]||'').trim());return o})}
function csvLine(l){const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c);c=''}else c+=ch}r.push(c);return r}
function num(v){if(!v||v==='')return null;const n=parseFloat(String(v).replace(',','.').replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n}
function pDate(v){if(!v)return null;let m=v.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=v.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],+m[1]-1,+m[2]);return null}
function getDate(r,d,t){return pDate(r[d])||pDate(r[t])}
function fmt(n,d=1){return n==null?'—':n.toFixed(d)}
function fmtD(d){if(!d)return'—';return d.getDate().toString().padStart(2,'0')+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getFullYear()}
function fmtISO(d){return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0')}
function fmtMoney(n){return n.toLocaleString('ru-RU')}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function sameMonth(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()}
function normalize(s){return(s||'').toLowerCase().trim().replace(/ё/g,'е').replace(/\s+/g,' ')}
function meaningfulWords(s){return s.split(' ').filter(w=>w.length>1&&!STOP_WORDS.has(w))}
function isCompositeDish(i){return i.split(' ').some(x=>STOP_WORDS.has(x))&&meaningfulWords(i).length>=2}
function cGBP(g,o){return g?'#1B8A5A':o?'#E8943A':'#E8637A'}
function cVal(p){return p>=.9?'#1B8A5A':p>=.5?'#27AE6B':'#B8B0A2'}
function isCoffee(p){return COFFEE_WORDS.some(w=>normalize(p).includes(w))}
function levenshtein(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}return d[m][n]}
function wordCoverage(i,r){const iw=meaningfulWords(i),rw=meaningfulWords(r);if(!iw.length)return 0;let m=0;for(const w of iw)if(rw.some(x=>x.includes(w)||w.includes(x)||levenshtein(w,x)<=1))m++;return m/iw.length}
function findInKBJU(raw,km){const i=normalize(raw);if(!i)return null;if(km[i])return{...km[i],mt:'exact',mto:i};if(COMPOSITE_DISHES[i])return{...COMPOSITE_DISHES[i],mt:'dish',mto:i};for(const[d,v]of Object.entries(COMPOSITE_DISHES)){if(wordCoverage(i,d)>=.8||wordCoverage(d,i)>=.8)return{...v,mt:'dish',mto:d}}if(isCompositeDish(i)){for(const[s,t]of Object.entries(SYNONYMS)){if(i===s){const tn=normalize(t);if(km[tn])return{...km[tn],mt:'synonym',mto:tn};for(const k of Object.keys(km))if(k.includes(tn)||tn.includes(k))return{...km[k],mt:'synonym',mto:k}}}return null}for(const[s,t]of Object.entries(SYNONYMS)){if(i===s){const tn=normalize(t);if(km[tn])return{...km[tn],mt:'synonym',mto:tn};for(const k of Object.keys(km))if(k.includes(tn)||tn.includes(k))return{...km[k],mt:'synonym',mto:k}}}for(const k of Object.keys(km)){const lr=Math.min(i.length,k.length)/Math.max(i.length,k.length);if(lr>=.5&&(k.includes(i)||i.includes(k)))return{...km[k],mt:'contains',mto:k}}let bk=null,bc=0;for(const k of Object.keys(km)){const c=wordCoverage(i,k);if(c>bc&&c>=.7){bc=c;bk=k}}if(bk)return{...km[bk],mt:'words',mto:bk};const iw=meaningfulWords(i);if(iw.length<=2){let bk2=null,bd=Infinity;for(const k of Object.keys(km)){for(const w of iw){if(w.length<4)continue;for(const kw of meaningfulWords(k)){if(kw.length<4)continue;const d=levenshtein(w,kw);if(d<=Math.floor(Math.min(w.length,kw.length)*.25)&&d<bd){bd=d;bk2=k}}}}if(bk2)return{...km[bk2],mt:'fuzzy',mto:bk2}}return null}

function setFilter(f){filter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===f||(f==='all'&&b.textContent.trim()==='Все')));render()}
function fp(a,c){return filter==='all'||!c?a:a.filter(r=>r[c]===filter)}
function setDateToday(){document.getElementById('dateInput').value=fmtISO(new Date());selectedDate=new Date();render()}
function onDateChange(){const v=document.getElementById('dateInput').value;selectedDate=v?new Date(v):null;render()}
function toggleCat(cat){expandedCat=expandedCat===cat?null:cat;render()}
function tip(value,goal,unit,moreIsBetter){if(moreIsBetter===undefined)moreIsBetter=true;if(goal==null||value==null)return'';const diff=goal-value,pct=Math.round(value/goal*100);let text,color;if(moreIsBetter){if(diff>0.05){text='Ещё '+fmt(diff)+' '+unit+' до нормы';color='#E8943A'}else if(diff>=-0.05){text='Норма ✓';color='#1B8A5A'}else{text='Превышено на '+fmt(Math.abs(diff))+' '+unit;color='#E8637A'}}else{if(diff>0.05){text='Ниже нормы на '+fmt(diff)+' '+unit;color='#1B8A5A'}else if(diff>=-0.05){text='На уровне нормы';color='#E8943A'}else{text='Превышено на '+fmt(Math.abs(diff))+' '+unit;color='#E8637A'}}return'<span class="tooltip" style="color:'+color+'">'+text+' ('+pct+'%)</span>'}

// SVG multi-line chart

function buildBodyChart(W, wGoals, SW, SH) {
  if (W.length < 2) return '';

  const hasWaist = W.some(r => r.waist != null);
  const hasHips = W.some(r => r.hips != null);

  // Собираем все значения для общего масштаба (отдельно для веса и замеров)
  const allW = W.map(r => r.w);
  const wMin = Math.min(...allW), wMax = Math.max(...allW);
  const wRange = wMax - wMin || 1;

  // Для талии/бёдер свой масштаб
  const measVals = [];
  W.forEach(r => { if (r.waist != null) measVals.push(r.waist); if (r.hips != null) measVals.push(r.hips); });
  const mMin = measVals.length ? Math.min(...measVals) : 0;
  const mMax = measVals.length ? Math.max(...measVals) : 100;
  const mRange = mMax - mMin || 1;

  const pad = 30; // отступ слева для меток
  const padR = 30; // отступ справа
  const chartW = SW - pad - padR;

  function xPos(i) { return pad + (i / (W.length - 1)) * chartW; }
  function yWeight(v) { return SH - ((v - wMin) / wRange * SH); }
  function yMeas(v) { return SH - ((v - mMin) / mRange * SH); }

  // Точки веса
  const wPts = W.map((r, i) => `${xPos(i).toFixed(1)},${yWeight(r.w).toFixed(1)}`).join(' ');

  // Точки талии (только непустые)
  let waistPts = '';
  if (hasWaist) {
    const wp = W.map((r, i) => r.waist != null ? { x: xPos(i), y: yMeas(r.waist) } : null).filter(Boolean);
    waistPts = wp.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  }

  // Точки бёдер
  let hipsPts = '';
  if (hasHips) {
    const hp = W.map((r, i) => r.hips != null ? { x: xPos(i), y: yMeas(r.hips) } : null).filter(Boolean);
    hipsPts = hp.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  }

  // Горизонтальные линии целей
  let goalLines = '';
  (wGoals || []).forEach(g => {
    if (g >= wMin && g <= wMax) {
      const y = yWeight(g).toFixed(1);
      const done = W[W.length - 1].w <= g;
      goalLines += `<line x1="${pad}" y1="${y}" x2="${SW - padR}" y2="${y}" stroke="${done ? '#1B8A5A' : '#E8943A'}" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6"/>`;
      goalLines += `<text x="${pad - 3}" y="${Number(y) + 3}" text-anchor="end" fill="${done ? '#1B8A5A' : '#E8943A'}" font-size="7" font-weight="700">${g}</text>`;
    }
  });

  // Метки оси Y слева (вес)
  let yLabels = '';
  [wMin, (wMin + wMax) / 2, wMax].forEach(v => {
    const y = yWeight(v).toFixed(1);
    yLabels += `<text x="${pad - 3}" y="${Number(y) + 3}" text-anchor="end" fill="#B8B0A2" font-size="6" font-weight="600">${fmt(v, 0)}</text>`;
  });

  // Метки оси Y справа (замеры)
  let yLabelsR = '';
  if (hasWaist || hasHips) {
    [mMin, (mMin + mMax) / 2, mMax].forEach(v => {
      const y = yMeas(v).toFixed(1);
      yLabelsR += `<text x="${SW - padR + 3}" y="${Number(y) + 3}" text-anchor="start" fill="#B8B0A2" font-size="6" font-weight="600">${fmt(v, 0)}</text>`;
    });
  }

  // Метки оси X (даты)
  let xLabels = '';
  const step = Math.max(1, Math.floor(W.length / 6));
  W.forEach((r, i) => {
    if (i % step === 0 || i === W.length - 1) {
      const x = xPos(i);
      xLabels += `<text x="${x.toFixed(1)}" y="${SH + 12}" text-anchor="middle" fill="#B8B0A2" font-size="6" font-weight="600">${r.date.getDate()}.${(r.date.getMonth() + 1).toString().padStart(2, '0')}</text>`;
    }
  });

  // Точки на последних значениях
  const lastW = W[W.length - 1];
  let dots = `<circle cx="${xPos(W.length - 1).toFixed(1)}" cy="${yWeight(lastW.w).toFixed(1)}" r="3" fill="#1B8A5A"/>`;
  if (hasWaist && lastW.waist != null) dots += `<circle cx="${xPos(W.length - 1).toFixed(1)}" cy="${yMeas(lastW.waist).toFixed(1)}" r="3" fill="#E8943A"/>`;
  if (hasHips && lastW.hips != null) dots += `<circle cx="${xPos(W.length - 1).toFixed(1)}" cy="${yMeas(lastW.hips).toFixed(1)}" r="3" fill="#7C6FD4"/>`;

  return `
    <svg viewBox="-5 -5 ${SW + 10} ${SH + 25}" style="width:100%;height:auto;display:block">
      ${goalLines}
      ${yLabels}
      ${yLabelsR}
      ${xLabels}
      <polyline points="${wPts}" fill="none" stroke="#1B8A5A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${waistPts ? `<polyline points="${waistPts}" fill="none" stroke="#E8943A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,2"/>` : ''}
      ${hipsPts ? `<polyline points="${hipsPts}" fill="none" stroke="#7C6FD4" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,3"/>` : ''}
      ${dots}
    </svg>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:10px;font-weight:700">
      <span style="color:#1B8A5A">● Вес ${fmt(lastW.w)} кг</span>
      ${hasWaist ? `<span style="color:#E8943A">┅ Талия ${lastW.waist != null ? fmt(lastW.waist, 0) + ' см' : '—'}</span>` : ''}
      ${hasHips ? `<span style="color:#7C6FD4">┅ Бёдра ${lastW.hips != null ? fmt(lastW.hips, 0) + ' см' : '—'}</span>` : ''}
    </div>`;
}

  // Самочувствие

    h+=`<div class="card"><div class="card-title">Самочувствие 7д</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="font-size:24px">${mAvg>=4?'😊':mAvg>=3?'😐':'😔'}</div><div class="tooltip-wrap" style="flex:1"><div class="hab-lbl">Настроение</div><div class="mid" style="color:${mC}">${fmt(mAvg)}<span class="xs"> /5</span></div><div class="bar-bg"><div class="bar" style="width:${(mAvg/5*100).toFixed(0)}%;background:${mC}"></div></div>${tip(mAvg,5,'б.',true)}</div></div>
      <div class="divider"></div>
      <div style="display:flex;align-items:center;gap:10px"><div style="font-size:24px">${eAvg>=4?'⚡':eAvg>=3?'🔋':'🪫'}</div><div class="tooltip-wrap" style="flex:1"><div class="hab-lbl">Энергия</div><div class="mid" style="color:${eC}">${fmt(eAvg)}<span class="xs"> /5</span></div><div class="bar-bg"><div class="bar" style="width:${(eAvg/5*100).toFixed(0)}%;background:${eC}"></div></div>${tip(eAvg,5,'б.',true)}</div></div></div>`}
  h+=`</div>`;

  // График тела
  if(W.length>1){
    h+=`<div class="card" style="margin-top:12px"><div class="card-title">📈 Динамика: вес · талия · бёдра</div>${buildBodyChart(W,wGoals,550,100)}
      <div class="flex-between sm" style="margin-top:4px"><span>мин <b>${fmt(Math.min(...W.map(r=>r.w)))}</b></span><span>сейчас <b style="color:#1B8A5A">${fmt(wL.w)}</b></span><span>макс <b>${fmt(Math.max(...W.map(r=>r.w)))}</b></span></div></div>`}

  // ПИТАНИЕ
  h+=`<div class="section-title">🍽️ Питание</div><div class="row-1-2">`;
  {const calP=clamp(tK/G.kcal,0,1),r2=38,c2=2*Math.PI*r2;
    let coffH='<div class="coffee-row">';for(let i=0;i<5;i++)coffH+=`<div class="coffee-cup ${i<cc?'':'empty'}">☕</div>`;coffH+='</div>';
    let waterH='<div class="coffee-row">';for(let i=0;i<5;i++)waterH+=`<div class="coffee-cup ${i<waterGlasses?'':'empty'}">🥤</div>`;waterH+='</div>';
    h+=`<div class="card"><div class="card-title">КБЖУ</div>
      <div class="tooltip-wrap" style="display:block"><svg viewBox="0 0 100 100" style="width:90px;height:90px;display:block;margin:0 auto"><circle cx="50" cy="50" r="${r2}" fill="none" stroke="#F0E6D8" stroke-width="6"/><circle cx="50" cy="50" r="${r2}" fill="none" stroke="${cVal(calP)}" stroke-width="6" stroke-dasharray="${c2.toFixed(1)}" stroke-dashoffset="${(c2-c2*calP).toFixed(1)}" stroke-linecap="round" transform="rotate(-90 50 50)"/><text x="50" y="42" text-anchor="middle" fill="#2D2A24" font-size="16" font-weight="900">${tK}</text><text x="50" y="55" text-anchor="middle" fill="#8C857A" font-size="8" font-weight="700">из ${G.kcal}</text><text x="50" y="63" text-anchor="middle" fill="#8C857A" font-size="7">ккал</text></svg>${tip(tK,G.kcal,'ккал',false)}</div>
      <div class="flex-around" style="margin-top:10px">${[['Б',tP,G.prot,'#1B8A5A','г'],['Ж',tF,G.fat,'#E8943A','г'],['У',tCb,G.carb,'#7C6FD4','г']].map(([l,v,g,col,u])=>{const p=clamp(v/g,0,1);return`<div class="center tooltip-wrap"><div style="font-size:10px;font-weight:800;color:${col}">${l}</div><div style="font-size:16px;font-weight:800;color:#2D2A24">${fmt(v)}</div><div class="bar-bg" style="width:44px;margin:4px auto"><div class="bar" style="width:${(p*100).toFixed(0)}%;background:${col}"></div></div><div class="xs">${g}г</div>${tip(v,g,u,true)}</div>`}).join('')}</div>
      <div class="divider"></div>
      <div class="center"><div class="xs">Кофе</div>${coffH}<div class="xs">${cc}/5</div></div>
      <div style="margin-top:6px" class="center"><div class="xs">Вода</div>${waterH}<div class="xs">${Math.round(waterToday)} мл</div></div>
    </div>`}
  {const ic={'Завтрак':'🌅','Обед':'☀️','Ужин':'🌙','Перекус':'🍎'};
    h+=`<div class="card"><div class="card-title">Питание · ${fmtD(vd)}</div>${dM.length===0?'<div class="center sm">Нет данных</div>':dM.map(m=>{const kt=m.kcal!=null?m.kcal:'?';const badge=m.mt==='manual'?'<span class="tag tag-manual">✏️</span>':(m.mt&&m.mt!=='exact'?`<span class="tag tag-fuzzy">≈${m.mto}</span>`:'');return`<div class="meal"><div class="meal-icon">${ic[m.meal]||'🍽️'}</div><div style="flex:1"><div class="meal-name">${m.prod}${badge}</div><div class="meal-meta">${m.meal}·${m.g||0}г</div></div><div class="meal-kcal">${kt}</div></div>`}).join('')}<div class="divider"></div><div class="center" style="font-size:15px;font-weight:900;color:#1B8A5A">Итого: ${tK} ккал</div>${miss.length?`<div style="margin-top:6px;padding:6px 10px;background:#FDE8EC;border-radius:8px;font-size:10px;color:#E8637A;font-weight:700;text-align:center">❌ ${miss.join(', ')}</div>`:''}</div>`}
  h+=`</div>`;

  // ПРИВЫЧКИ
  h+=`<div class="section-title">✅ Привычки</div><div class="row-2">`;
  {const items=[['💧','Вода·7д',Math.round(avgWater)+' мл',avgWater>=G.water*.8,avgWater>=G.water*.6,avgWater/G.water,avgWater,G.water,'мл'],['😴','Сон·7д',fmt(avgSleep)+' ч',avgSleep>=7,avgSleep>=6,avgSleep/G.sleep,avgSleep,G.sleep,'ч'],['🏋️','Тренировки·28д',tCnt+' дн ('+Math.round(avgTrainMin)+' мин/тр)',tCnt>=12,tCnt>=8,tCnt/16,tCnt,12,'дн'],['🍷','Без алкоголя',noAlco+' дн',noAlco>=14,noAlco>=7,null,null,null,null],['🚬','Сигареты/день',fmt(avgCig),avgCig===0,avgCig<=1,null,null,null,null]];
    h+=`<div class="card"><div class="card-title">Привычки</div>${items.map(([ic,lb,vl,g,o,p,val,goal,unit])=>{const cl=cGBP(g,o);return`<div class="hab tooltip-wrap"><div class="hab-icon">${ic}</div><div style="flex:1"><div class="hab-lbl">${lb}</div><div class="hab-val" style="color:${cl}">${vl}</div>${p!=null?`<div class="bar-bg"><div class="bar" style="width:${clamp(p*100,0,100).toFixed(0)}%;background:${cl}"></div></div>`:''}</div>${val!=null?tip(val,goal,unit,true):''}</div>`}).join('')}</div>`}
  {const yr=vd.getFullYear(),mo=vd.getMonth(),sd=(new Date(yr,mo,1).getDay()+6)%7,dim=new Date(yr,mo+1,0).getDate();const mn=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];let tM=0,cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cal-header">${d}</div>`).join('');for(let i=0;i<sd;i++)cells+=`<div class="cal-cell cal-empty"></div>`;for(let d=1;d<=dim;d++){const dt=new Date(yr,mo,d),ok=aTD.has(dt.toDateString());if(ok)tM++;const isV=sameDay(dt,vd),isT=sameDay(dt,now);const hE=H.find(r=>sameDay(r.date,dt)&&r.trainMin);cells+=`<div class="cal-cell" style="background:${ok?'#1B8A5A':'#F0E6D8'};color:${ok?'white':'#8C857A'};${isV?'box-shadow:0 0 0 2.5px #E8637A;':isT?'box-shadow:0 0 0 2px #7C6FD4;':''}" title="${hE?fmtD(dt)+' — '+hE.trainMin+' мин':fmtD(dt)}">${d}</div>`}
    h+=`<div class="card"><div class="card-title">🏋️ ${mn[mo]} ${yr}</div><div class="cal-grid">${cells}</div><div class="center" style="margin-top:10px;font-size:14px"><span style="color:#1B8A5A;font-weight:900">${tM}</span><span class="sm"> тренировок</span></div><div class="legend"><span><span class="leg-box" style="background:#F0E6D8"></span>нет</span><span><span class="leg-box" style="background:#1B8A5A"></span>да</span></div></div>`}
  h+=`</div>`;

  // ФИНАНСЫ
  h+=`<div class="section-title">💰 Финансы</div><div class="row-2">`;
  {h+=`<div class="card"><div class="card-title">За месяц · ${fmtMoney(Math.round(monthFTotal))} ₽</div>`;if(catSorted.length===0){h+=`<div class="center sm">Нет данных</div>`}else{h+=`<div class="fin-bar">`;catSorted.forEach(([cat,total])=>{const pct=(total/monthFTotal*100).toFixed(1);const ci=getCatStyle(cat);h+=`<div style="width:${pct}%;background:${ci.color}" title="${cat}: ${fmtMoney(Math.round(total))} ₽"></div>`});h+=`</div><div style="margin-top:10px">`;catSorted.forEach(([cat,total])=>{const ci=getCatStyle(cat);const pct=Math.round(total/monthFTotal*100);const isExp=expandedCat===cat;const items=monthF.filter(r=>r.cat===cat);h+=`<div style="margin-bottom:2px"><div onclick="toggleCat('${cat.replace(/'/g,"\\'")}')" style="display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;border-radius:6px;${isExp?'background:'+ci.bg:''}"><span style="font-size:14px">${ci.icon}</span><span class="fin-cat-badge" style="background:${ci.bg};color:${ci.color}">${cat}</span><span style="flex:1"></span><span style="font-weight:800">${fmtMoney(Math.round(total))} ₽</span><span class="xs" style="width:30px;text-align:right">${pct}%</span><span style="font-size:10px;color:${ci.color};margin-left:4px">${isExp?'▲':'▼'}</span></div>`;if(isExp){h+=`<div style="padding:4px 0 8px 32px;font-size:12px">`;items.forEach(r=>{h+=`<div style="display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #F5F0E8"><span style="color:#8C857A;font-size:10px;min-width:50px">${fmtD(r.date)}</span><span style="flex:1;font-weight:600">${r.desc||'—'}</span><span style="font-weight:700">${fmtMoney(Math.round(r.amount))} ₽</span></div>`});h+=`</div>`}h+=`</div>`});h+=`</div>`}h+=`</div>`}
  {h+=`<div class="card"><div class="card-title">Расходы · ${fmtD(vd)} · ${fmtMoney(Math.round(dayFTotal))} ₽</div>`;if(dayF.length===0){h+=`<div class="center sm">Нет трат</div>`}else{dayF.forEach(r=>{const ci=getCatStyle(r.cat);h+=`<div class="fin-row"><span style="font-size:14px">${ci.icon}</span><span class="fin-cat-badge" style="background:${ci.bg};color:${ci.color}">${r.cat}</span><div style="flex:1"><div class="fin-desc">${r.desc||'—'}</div></div><div class="fin-amount">${fmtMoney(Math.round(r.amount))} ₽</div></div>`})}h+=`</div>`}
  h+=`</div>`;

  document.getElementById('app').innerHTML=h;
}
load();
</script>
